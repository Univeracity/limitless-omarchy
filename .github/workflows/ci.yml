name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development tools and the pinned public core
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --upgrade 'setuptools>=83.0.0'
          python -m pip install -e ".[dev]"
      - name: Run change-aware test scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEST_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PULL_REQUEST_BASE_SHA" ]; then
            test_base_sha="$PULL_REQUEST_BASE_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            test_base_sha="$BEFORE_SHA"
          else
            test_base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi
          python .github/scripts/changed_test_scope.py \
            --root . \
            --base "$test_base_sha" \
            --head "$TEST_HEAD_SHA" \
            --run
      - name: Lint
        run: ruff check src tests .github/scripts
      - name: Check formatting
        run: ruff format --check src tests .github/scripts
      - name: Static security scan
        run: bandit -r -q src
      - name: Dependency vulnerability scan
        run: pip-audit --local --progress-spinner off
      - name: Build source distribution
        if: matrix.python-version == '3.11'
        run: python -m build --sdist --outdir dist
      - name: Verify source distribution contents
        if: matrix.python-version == '3.11'
        run: python scripts/verify-distribution.py dist/limitless_omarchy-*.tar.gz
      - name: Install and exercise the source distribution
        if: matrix.python-version == '3.11'
        run: |
          python -m venv /tmp/limitless-omarchy-sdist
          /tmp/limitless-omarchy-sdist/bin/pip install dist/limitless_omarchy-*.tar.gz
          /tmp/limitless-omarchy-sdist/bin/limitless-omarchy query --catalog examples/catalog > /tmp/limitless-omarchy-sdist-query.json
          /tmp/limitless-omarchy-sdist/bin/python -c "import json; assert json.load(open('/tmp/limitless-omarchy-sdist-query.json'))['disposition'] == 'source-free-method'"

  omarchy-contract:
    name: Omarchy plugin contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the pinned Quattro plugin validator
        run: |
          git init omarchy-contract
          git -C omarchy-contract remote add origin https://github.com/basecamp/omarchy.git
          git -C omarchy-contract fetch --depth=1 origin 30f7a06090dc20dd1a4a8d0c99bfb8e2370df2ec
          git -C omarchy-contract checkout --detach FETCH_HEAD
      - name: Validate the distributable plugin
        run: omarchy-contract/bin/omarchy-plugin-validate .
